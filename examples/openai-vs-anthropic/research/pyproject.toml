[project]
name = "openai-vs-anthropic-research"
version = "0.1.0"
description = "Reproducible collection and analysis behind the RichView OpenAI-versus-Anthropic report."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "httpx>=0.28",
    "playwright>=1.50",
    "polars>=1.30",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["."]
