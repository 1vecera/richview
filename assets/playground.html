## What moved

These demonstration values make the chart easy to inspect. Change the source and the report updates.

```chart
type: line
title: Revenue rose after February
data:
  inline:
    - month: 2026-01
      revenue: 100
    - month: 2026-02
      revenue: 140
    - month: 2026-03
      revenue: 185
encoding: { x: month, y: revenue }
axes:
  y: { label: Revenue, unit: K }
```

*Source: demonstration values, invented for this example.*
