[package]
rust-version.workspace = true
name = "richview-site"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
richview-core = { path = "../richview-core" }
richview-chart = { path = "../../richview-chart" }
# The live example's completion is the editor service's own (ARC-09).
richview-authoring = { path = "../richview-authoring" }
serde_json = "1"
serde = "1"
base64 = "0.22"
miniz_oxide = "0.9"

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "HtmlDocument", "HtmlHeadElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlInputElement", "HtmlIFrameElement", "HtmlAnchorElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics", "CssStyleDeclaration", "Event", "EventTarget", "MouseEvent", "PointerEvent", "KeyboardEvent", "InputEvent", "ClipboardEvent", "DataTransfer", "Performance", "DomRect", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "UrlSearchParams", "Location", "Response", "Request", "RequestInit", "AbortController", "AbortSignal", "Headers", "MediaQueryList", "IntersectionObserver", "IntersectionObserverEntry", "CustomEvent", "CustomEventInit", "Worker", "MessageEvent", "Path2d", "FontFaceSet", "IntersectionObserverInit", "History", "console", "Storage", "Text", "CharacterData", "Range", "DomRectList", "DomTokenList", "HtmlCollection"] }
