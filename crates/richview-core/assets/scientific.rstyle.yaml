# RichView house style — "scientific".
# Light warm-paper (70°) academic working-paper. RichView Serif (display + body) +
# RichView Sans (ui) + RichView Code (mono). Steel-blue accent, calm and credible.
colophon: show
# Graph paper behind the text, kept small so the serif reads first (STY-74). Inks keep their
# floors over the grid's lines; paper prints the flat page. `background: none` turns it off.
background:
  texture: grid
  strength: small
tokens:
  scheme: light
  bg: "oklch(0.99 0.004 70)"
  bg-elev: "oklch(0.975 0.005 70)"
  bg-chart: "oklch(0.985 0.004 70)"
  ink: "oklch(0.18 0.006 70)"
  ink-soft: "oklch(0.42 0.008 70)"
  ink-faint: "oklch(0.62 0.008 70)"
  rule: "oklch(0.88 0.006 70)"
  rule-soft: "oklch(0.93 0.005 70)"
  accent: "oklch(0.5196 0.1248 247.06)"
  accent-soft: "oklch(0.5196 0.1248 247.06 / 0.094)"
  link: "oklch(0.5196 0.1248 247.06)"
  brand: "oklch(0.5196 0.1248 247.06)"
  # Semantic colors unified with brutalist (both warm-paper light themes; the tiny
  # chroma/lightness drift between the two was visually imperceptible).
  up: "oklch(0.45 0.12 150)"
  down: "oklch(0.50 0.16 25)"
  hold: "oklch(0.55 0.13 70)"
  chart-ink: "oklch(0 0 0)"
  font-text: '"RichView Serif", Georgia, serif'
  font-display: '"RichView Serif", Georgia, serif'
  font-ui: '"RichView Sans", system-ui, sans-serif'
  font-mono: "RichView Code, ui-monospace, monospace"
  size-small: "13.75px"
  size-base: "16.5px"
  size-h3: "20px"
  size-h2: "28px"
  size-h1: "36px"
  size-display: "44px"
  size-small-phone: "13.75px"
  size-base-phone: "16.5px"
  size-h3-phone: "20px"
  size-h2-phone: "28px"
  size-h1-phone: "32px"
  size-display-phone: "36px"
  line-base: "1.65"
  measure: "42rem"
  print-measure: "78ch"
  radius-s: "2px"
  radius-m: "2px"
  shadow-float: "0 2px 8px oklch(0 0 0 / 0.12)"
  density: 1
  block-gap: "4rem"
  block-gap-phone: "2.5rem"
layout:
  report-max-width: "880px"
# Restrained: a short fade, no travel.
motion:
  character: restrained
  duration: 240
  easing: standard
  stagger: 16
  block-entrance: fade
  distance: 0
components:
  thumbnail:
    rule: hairline
  figure:
    frame: none
    title: above
    description: below-boxed
  # Rule-bracketed stat line: hairline rules above and below. The academic register.
  metric:
    style: bracket
  # The deck is set in the true Source Serif italic when the build embeds it.
  callout:
    border-width: "2px"
  deck:
    style: italic
  # A slides source stands on this stage (FEA-RP-65): the talk of a good paper: a title page, headings over a rule, numbered figures and tables, booktabs rules.
  slides:
    stage: paper
chart:
  legend: top
  palette: scientific
  # Sequential ramp for heatmaps, mixed in OKLCH; salience rises with value (steel blue, light to dark).
  ramp: ["oklch(0.95 0.015 235)", "oklch(0.73 0.07 237)", "oklch(0.44 0.095 240)"]
  negative-ramp: ["oklch(0.95 0.015 25)", "oklch(0.70 0.13 30)", "oklch(0.44 0.095 30)"]
  bar-radius: 3
