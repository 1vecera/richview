[package]
rust-version.workspace = true
name = "richview-authoring"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The editor's source operations, pure so the site can run them in Wasm too: the editor service
# and the home page's editor offer the same completions and diagnostics (S27-931, ARC-09).
[dependencies]
richview-core = { path = "../richview-core" }
serde_json = "1"
yaml-rust2 = { version = "0.13.0", default-features = false }
pulldown-cmark = "0.13"
