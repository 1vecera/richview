[package]
rust-version.workspace = true
name = "richview-app"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "richview_app"
path = "src/lib.rs"

[[bin]]
name = "richview"
path = "src/bin/richview.rs"

[features]
# Compile the staged report runtime into the binary (ARC-07); richview-build turns it on.
embedded-runtime = []

[dependencies]
richview-core = { path = "../richview-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
mime_guess = "2"
sha2 = "0.10"
fs2 = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
flate2 = "1"
bytes = "1"
fastrand = "2"
futures-util = "0.3"
md-5 = "0.11"
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto", "xml"] }
duckdb = { version = "1", features = ["bundled"] }
csv = "1"
argon2 = "0.5"
richview-share = { path = "../richview-share" }
getrandom = "0.3"
tempfile = "3"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
regex = "1"
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
quoted_printable = "0.5"
