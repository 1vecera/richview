[package]
rust-version.workspace = true
name = "richview-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The report runtime: draws each chart's geometry model with WebGL2 and handles reading, inspection and actions."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
richview-chart = { path = "../../richview-chart" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
richview-core = { path = "../richview-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlCanvasElement", "HtmlButtonElement", "HtmlDialogElement", "HtmlAnchorElement", "CanvasRenderingContext2d", "TextMetrics", "CssStyleDeclaration", "DomTokenList", "DomRect", "DomRectList", "Range", "Event", "EventTarget", "CustomEvent", "CustomEventInit", "History", "Location", "MouseEvent", "UiEvent", "PointerEvent", "WheelEvent", "KeyboardEvent", "FocusEvent", "FocusOptions",
    "ImageData", "Performance", "Blob", "BlobPropertyBag", "Url", "MediaQueryList", "ResizeObserver", "ResizeObserverEntry", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "FontFaceSet", "FontFaceSetLoadStatus", "HtmlCollection", "Response", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject", "WebGlContextAttributes", "WebGlContextEvent", "console"] }
