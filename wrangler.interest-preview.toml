# Local-only review configuration. It is deliberately not the live richview-teaser config.
name = "richview-interest-local"
main = "cloudflare/interest-worker.ts"
compatibility_date = "2026-10-05"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "INTEREST_DB"
database_name = "richview-interest-local"
database_id = "00000000-0000-0000-0000-000000000590"
migrations_dir = "cloudflare/migrations"

[[ratelimits]]
name = "SIGNUP_RATE_LIMIT"
namespace_id = "59020261005"
[ratelimits.simple]
limit = 10
period = 60
