name = "richview-teaser"
main = "cloudflare/interest-worker.ts"
account_id = "f321662ae21d0592d8b75bd8ddecc241"
compatibility_date = "2026-10-04"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "INTEREST_DB"
database_name = "richview-interest"
database_id = "8610028f-1c4a-40de-8cff-599ae205eeed"
migrations_dir = "cloudflare/migrations"

[[ratelimits]]
name = "SIGNUP_RATE_LIMIT"
namespace_id = "61120261011"
[ratelimits.simple]
limit = 10
period = 60

[[routes]]
pattern = "richview.ai"
custom_domain = true
