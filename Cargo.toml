[workspace]
members = ["richview-chart", "crates/*"]
resolver = "3"

[workspace.package]
version = "3.0.0-alpha.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/richview-universe/richview-v3"
rust-version = "1.99"

# Debug builds keep line tables for panics and backtraces, and dependencies no debug info: each
# stream's own target stays small and test binaries link fast (DEL-81).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The Wasm the browser downloads is built for size (PRF-30, PRF-31). The report runtime draws
# charts every frame, so it keeps speed within that (`s`); the site runtime parses and renders
# in a worker, so it takes the smallest build (`z`).
[profile.wasm-release]
inherits = "release"
opt-level = "s"

[profile.wasm-site]
inherits = "wasm-release"
opt-level = "z"
